spring:
  application:
    name: order-service
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=ORDERS
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only maps onto it
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ORDERS
    default-schema: ORDERS

server:
  port: ${SERVER_PORT:8086}

order:
  # how long a customer has to pay; after that the order is cancelled and its stock released
  payment-timeout: 15m
  # Inventory holds stock this long. Must stay above payment-timeout so a late capture can still be deducted.
  reservation-ttl: 30m
  jobs:
    enabled: true
    settle-interval: 30s

# Downstream services (TDD §12.6: Order -> Cart, Inventory reserve/deduct/release, Payment intents/refunds)
cart-service:
  base-url: ${CART_SERVICE_URL:http://localhost:8084}
  connect-timeout: 5s
  read-timeout: 30s
inventory-service:
  base-url: ${INVENTORY_SERVICE_URL:https://inventory-manager-8q64.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  connect-timeout: 5s
  read-timeout: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
