spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:production-fgivv4.eu.cluster.ntail.io:9092}
    # Cloud cluster login. Only the password is a secret: set KAFKA_PASSWORD in the environment, never in this file.
    # For a local plaintext broker set KAFKA_SECURITY_PROTOCOL=PLAINTEXT and KAFKA_BOOTSTRAP_SERVERS=localhost:9092.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:default}" password="${KAFKA_PASSWORD:}";
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only maps onto it
      ddl-auto: none
    properties:
      hibernate:
        # qualify every table with the service schema instead of relying on the session's CURRENT_SCHEMA
        default_schema: ORDERS
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ORDERS
    default-schema: ORDERS

server:
  tomcat:
    mbeanregistry:
      enabled: true
  port: ${SERVER_PORT:8086}

order:
  # how long a customer has to pay; after that the order is cancelled and its stock released
  payment-timeout: 15m
  # a declined payment can be retried with another payment method up to this many attempts
  max-payment-attempts: 3
  # Inventory holds stock this long. Must stay above payment-timeout so a late capture can still be deducted.
  reservation-ttl: 30m
  events:
    # log = print events (no broker needed); kafka = publish the outbox to the topic below
    publisher: ${EVENTS_PUBLISHER:log}
    topic: domain.order.events
    # true = settle orders as soon as Payment's PAYMENT_SUCCESS / PAYMENT_FAILED arrives
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:false}
    # Topics are created at startup with these partition counts (free cluster quota: 10 topics, 64 partitions)
    create-topics: ${EVENTS_CREATE_TOPICS:true}
    partitions: 3
    payment-topic: domain.payment.events
    inventory-topic: domain.inventory.events
  outbox:
    poll-interval: 1s
    batch-size: 100
  jobs:
    enabled: true
    # With the payment consumer on, polling is only a safety net and the payment timeout; set ORDER_SETTLE_INTERVAL=5m.
    settle-interval: ${ORDER_SETTLE_INTERVAL:30s}

# Downstream services (TDD §12.6: Order -> Cart, Inventory reserve/deduct/release, Payment intents/refunds)
cart-service:
  base-url: ${CART_SERVICE_URL:https://cart-service-csoc.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
inventory-service:
  base-url: ${INVENTORY_SERVICE_URL:https://inventory-manager-8q64.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
payment-service:
  base-url: ${PAYMENT_SERVICE_URL:https://payment-service-iyeh.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false


management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth headers come from OTEL_EXPORTER_OTLP_HEADERS; only active while OTEL_METRICS_EXPORTER=otlp.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Browser origins allowed to call this API (comma separated, e.g. the test console). Empty = none.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
